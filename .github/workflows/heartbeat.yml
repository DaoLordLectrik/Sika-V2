name: Heartbeat Check

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

jobs:
  check-heartbeat:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run heartbeat check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/heartbeat_check.py
      
      - name: Commit heartbeat data
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Configure git with the PAT for authentication
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Set the remote URL with the PAT for authentication
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          
          # Add data files
          git add data/ || true
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update heartbeat data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi