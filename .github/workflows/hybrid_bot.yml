name: Hybrid Trading Bot

on:
  # schedule removed - using cron-job.org only to avoid duplicates
  workflow_dispatch:

jobs:
  run-hybrid-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv
          pip install "scikit-learn==1.9.0" joblib ta textblob vaderSentiment
          pip install -r hybrid-bot/requirements.txt 2>/dev/null || true
      
      - name: Create data directories
        run: |
          mkdir -p data
          mkdir -p hybrid-bot/data
          mkdir -p hybrid-bot/models
      
      - name: Run hybrid bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python hybrid-bot/scripts/run_hybrid.py
      
      - name: Commit data files
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}
          git add data/ || true
          git add hybrid-bot/data/ || true
          git diff --staged --quiet || git commit -m "Update signal data [skip ci]"
          git push origin HEAD:${{ github.ref_name }} || true