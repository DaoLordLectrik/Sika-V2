name: Hybrid Trading Bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  run-hybrid-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r hybrid-bot/requirements.txt
      
      - name: Create data directories
        run: |
          mkdir -p data
          mkdir -p hybrid-bot/data
      
      - name: Run hybrid bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python hybrid-bot/scripts/run_hybrid.py
      
      - name: Commit data files
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git add data/ || true
          git add hybrid-bot/data/ || true
          git diff --staged --quiet || git commit -m "Update signal data [skip ci]"
          git push origin HEAD:${{ github.ref_name }} || true